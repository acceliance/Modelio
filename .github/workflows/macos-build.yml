name: macOS build

# Cross-builds the macOS products (Intel x86_64 and Apple Silicon aarch64) with Tycho on Linux, then smoke-tests
# each archive on a matching macOS runner (extract, clear quarantine, start the app, check it stays up).
# Each archive is then packaged as a .dmg on a macOS runner (ad-hoc signed by default; with the repository secrets of
# .github/MACOS-SIGNING.md and `sign: true` on a manual run: Developer ID signed + notarized + stapled), and the smoke
# test starts the app from the mounted .dmg and takes a screenshot. A self-test signs a build with a throw-away
# certificate (hardened runtime + entitlements) and runs it, which exercises everything except Apple's notary service.
# Not covered: any real UI interaction.

on:
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign with the Developer ID certificate and notarize (needs the repository secrets, see .github/MACOS-SIGNING.md)'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'products/**'
      - 'dev-platform/pack-resources/**'
      - 'generate-target.sh'
      - 'build-mac.sh'
      - 'setup-wsl.sh'
      - '.github/workflows/macos-build.yml'
      - '.github/scripts/**'

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS products (Linux runner)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Tycho 4.0.x runs on JDK 17+; bundles compile for Java 8/11 through toolchains.
      # The last java-version listed becomes the default JAVA_HOME (17).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            11
            17

      # Tycho 4.0.13 fails on the runner's preinstalled Maven ("No implementation for
      # MavenTargetLocationFactory was bound"); 3.9.9 is the version the build was validated with.
      - name: Install Maven 3.9.9
        run: |
          V=3.9.9
          BASE=https://archive.apache.org/dist/maven/maven-3/$V/binaries
          curl -fsSL -o "$RUNNER_TEMP/maven.tar.gz" "$BASE/apache-maven-$V-bin.tar.gz"
          echo "$(curl -fsSL "$BASE/apache-maven-$V-bin.tar.gz.sha512")  $RUNNER_TEMP/maven.tar.gz" | sha512sum -c -
          tar xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$V/bin" >> "$GITHUB_PATH"

      - name: Maven toolchains
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/toolchains.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains>
            <toolchain><type>jdk</type><provides><id>JavaSE-1.8</id><version>11</version><vendor>Temurin</vendor></provides><configuration><jdkHome>${JAVA_HOME_11_X64}</jdkHome></configuration></toolchain>
            <toolchain><type>jdk</type><provides><id>JavaSE-11</id><version>11</version><vendor>Temurin</vendor></provides><configuration><jdkHome>${JAVA_HOME_11_X64}</jdkHome></configuration></toolchain>
            <toolchain><type>jdk</type><provides><id>JavaSE-17</id><version>17</version><vendor>Temurin</vendor></provides><configuration><jdkHome>${JAVA_HOME_17_X64}</jdkHome></configuration></toolchain>
          </toolchains>
          EOF
          java -version
          mvn -version

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/MANIFEST.MF') }}
          restore-keys: m2-${{ runner.os }}-

      - name: Build Intel (x86_64)
        run: |
          chmod +x build-mac.sh generate-target.sh
          ./build-mac.sh

      - name: Intel archive sanity check
        run: ./build-mac.sh --check-only

      # The features were installed into ~/.m2 by the full Intel build above and already contain the
      # aarch64 entries, so only the target definition and the products module are rebuilt.
      - name: Build Apple Silicon (aarch64)
        run: ./build-mac.sh --arm64 --products-only

      - name: Apple Silicon archive sanity check
        run: ./build-mac.sh --arm64 --check-only

      - uses: actions/upload-artifact@v4
        with:
          name: modelio-macosx-x86_64
          path: dist/modelio-*-macosx-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: modelio-macosx-aarch64
          path: dist/modelio-*-macosx-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package .dmg (${{ matrix.arch }})
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: modelio-macosx-${{ matrix.arch }}

      # Only on a manual run with sign=true. Imports the Developer ID certificate from the repository secrets into a
      # temporary keychain and exports SIGN_*/NOTARY_* for package-dmg.sh (which then also notarizes and staples).
      - name: Prepare Developer ID signing and notarization
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash .github/scripts/ci-prepare-signing.sh

      - name: Build the .dmg
        run: |
          bash .github/scripts/package-dmg.sh ${{ matrix.arch }} modelio-*-macosx-${{ matrix.arch }}.tar.gz             "$PWD/Modelio-5.4.1-macosx-${{ matrix.arch }}.dmg"

      - name: Test run-on-mac.sh (install from the .dmg, three ways)
        run: |
          DMG="$PWD/Modelio-5.4.1-macosx-${{ matrix.arch }}.dmg"
          export INSTALL_DIR="$RUNNER_TEMP/Apps"
          APPDIR="$INSTALL_DIR/Modelio 5.4.1.app"
          check() {
            test -x "$APPDIR/Contents/MacOS/modelio"
            codesign --verify --strict --verbose=2 "$APPDIR"
            if xattr -lr "$APPDIR" | grep -q com.apple.quarantine; then echo "quarantine flag left on the installed app"; exit 1; fi
            echo "OK: $1"
          }
          echo "### 1. script from the repo, pointed at the .dmg"
          bash .github/scripts/run-on-mac.sh --no-launch "$DMG"; check "path to .dmg"; rm -rf "$INSTALL_DIR"

          echo "### 2. the one-liner: script from inside the mounted image"
          MNT="$RUNNER_TEMP/mnt-test"; mkdir -p "$MNT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT" -quiet
          ls -la "$MNT"
          bash "$MNT/run-on-mac.sh" --no-launch
          hdiutil detach "$MNT" -quiet
          check "run from inside the image"; rm -rf "$INSTALL_DIR"

          echo "### 3. a downloaded copy: quarantine flag + SHA256SUMS.txt next to the .dmg"
          DL="$RUNNER_TEMP/dl"; mkdir -p "$DL"; cp "$DMG" .github/scripts/run-on-mac.sh "$DL/"
          (cd "$DL" && shasum -a 256 Modelio-*.dmg > SHA256SUMS.txt && xattr -w com.apple.quarantine "0081;5f000000;Safari;" Modelio-*.dmg && xattr -l Modelio-*.dmg)
          bash "$DL/run-on-mac.sh" --no-launch "$DL/$(basename "$DMG")"; check "downloaded copy with checksum"; rm -rf "$INSTALL_DIR"
          if [ "${{ matrix.arch }}" = aarch64 ]; then
            echo "### 4. no argument: pick the .dmg matching this Mac (Apple Silicon runner)"
            bash "$DL/run-on-mac.sh" --no-launch; check "auto-detected .dmg"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: modelio-dmg-${{ matrix.arch }}
          path: Modelio-5.4.1-macosx-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Remove the temporary keychain and keys
        if: always()
        run: bash .github/scripts/ci-cleanup-signing.sh

  smoke-test:
    name: Smoke test (${{ matrix.arch }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel runner for the x86_64 product. If this label is unavailable for your account/plan,
          # use macos-latest (Apple Silicon) with Rosetta 2 installed.
          - arch: x86_64
            runner: macos-15-intel
          # Apple Silicon runner for the native aarch64 product.
          - arch: aarch64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: modelio-dmg-${{ matrix.arch }}

      - name: Mount the .dmg and copy the app out
        run: |
          echo "runner arch: $(uname -m)"
          DMG="$(ls Modelio-*-macosx-${{ matrix.arch }}.dmg)"
          hdiutil verify "$DMG"
          MNT="$RUNNER_TEMP/mnt"; mkdir -p "$MNT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
          ls -la "$MNT"
          SRC="$(ls -d "$MNT"/*.app | head -1)"
          APP="$RUNNER_TEMP/$(basename "$SRC")"
          ditto "$SRC" "$APP"
          hdiutil detach "$MNT"
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "---- signature of the app taken from the .dmg:"
          codesign --verify --strict --verbose=2 "$APP"
          ls -l "$APP/Contents/MacOS" "$APP/Contents/Eclipse" | head -30

      - name: Binary architectures
        run: |
          file "$APP/Contents/MacOS/modelio" "$APP/Contents/Eclipse/jre/Contents/Home/bin/java"

      - name: Bundled JRE runs
        run: |
          "$APP/Contents/Eclipse/jre/Contents/Home/bin/java" -version

      - name: Start the application
        run: |
          set +e
          LOG="$RUNNER_TEMP/modelio-stdout.log"
          "$APP/Contents/MacOS/modelio" -nosplash -consoleLog > "$LOG" 2>&1 &
          PID=$!
          echo "started pid $PID"

          diagnostics() {
            echo "==== diagnostics ===="
            echo "---- processes ----"; ps -axo pid,ppid,etime,command | grep -i "[m]odelio\|[j]re/Contents/Home/bin/java" | cut -c1-220
            echo "---- stdout/stderr ($(wc -l < "$LOG") lines) ----"; tail -80 "$LOG"
            echo "---- ~/.modelio ----"; find "$HOME/.modelio" -maxdepth 4 2>/dev/null | head -40
            for f in "$HOME"/.modelio/*/*.log "$HOME"/.modelio/*/*/data/.metadata/.log "$HOME"/.modelio/*/*/conf/*.log; do
              [ -f "$f" ] && { echo "---- $f ----"; tail -80 "$f"; }
            done
            JPID="$(pgrep -f 'jre/Contents/Home/bin/java' | head -1)"
            if [ -n "$JPID" ]; then
              echo "---- sample of java pid $JPID (3s) ----"; sample "$JPID" 3 -file "$RUNNER_TEMP/sample.txt" > /dev/null 2>&1
              head -120 "$RUNNER_TEMP/sample.txt" 2>/dev/null
            fi
          }

          # wait up to 90 s for the process to die or for Modelio to report that it initialised
          for i in $(seq 1 18); do
            sleep 5
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::Modelio exited after about $((i*5))s"
              diagnostics
              exit 1
            fi
            # the OSGi session header (!SESSION ... java.version=...) is printed by -consoleLog once the framework
            # is up; wait for it, because logback lines can appear before it
            JV="$(grep -m1 '^java.version=' "$LOG" | cut -d= -f2)"
            if [ -n "$JV" ] && [ -z "$JV_OK" ]; then
              echo "application java.version=$JV"
              case "$JV" in
                11.*) JV_OK=1 ;;
                *) echo "::error::The application ran on Java '$JV', not the bundled Java 11 (launcher did not use the bundled JRE)"
                   diagnostics; kill "$PID" 2>/dev/null; exit 1 ;;
              esac
            fi
            if [ -n "$JV_OK" ] && grep -qE "org\.modelio|logback" "$LOG"; then
              echo "Modelio initialised after about $((i*5))s ($(grep -cE 'org\.modelio' "$LOG") org.modelio log lines)"
              sleep 25   # let startup continue (Welcome page, workbench), then summarise and take a screenshot
              screencapture -x "$RUNNER_TEMP/screenshot-${{ matrix.arch }}.png" 2>&1 || echo "screencapture failed"
              ls -l "$RUNNER_TEMP"/screenshot-*.png 2>/dev/null
              osascript -e 'tell application "System Events" to get name of every process whose background only is false' 2>&1 | head -3 || true
              echo "---- log summary: $(wc -l < "$LOG") lines, $(grep -ciE 'exception|error' "$LOG") mention exception/error ----"
              echo "---- first 25 lines ----"; head -25 "$LOG" | cut -c1-200
              echo "---- most frequent messages (numbers masked) ----"
              sed -E 's/^[0-9:.,]+ *//; s/[0-9]+/N/g' "$LOG" | cut -c1-120 | sort | uniq -c | sort -rn | head -8
              echo "---- last 25 lines ----"; tail -25 "$LOG" | cut -c1-200
              echo "---- exception/error lines (first 10) ----"; grep -iE 'exception|error' "$LOG" | head -10 | cut -c1-220
              if kill -0 "$PID" 2>/dev/null; then echo "process still alive after summary"; else echo "::warning::process exited during the extra 10 s"; fi
              kill "$PID" 2>/dev/null
              # the framework can come up while the application itself fails (unresolved bundles, missing natives)
              if grep -qE '^!MESSAGE Application error|could not be found in the registry|UnsatisfiedLinkError' "$LOG"; then
                echo "::error::Modelio logged an application error (see summary above)"
                grep -nE -A6 '^!MESSAGE Application error|could not be found in the registry|UnsatisfiedLinkError' "$LOG" | head -30 | cut -c1-220
                exit 1
              fi
              exit 0
            fi
          done
          echo "::error::Process is alive but Modelio logged nothing in 90 s (JVM started, application did not initialise)"
          diagnostics
          kill "$PID" 2>/dev/null
          exit 1

      # A double-click starts the app through LaunchServices (no shell PATH/JAVA_HOME), which is what a user does.
      - name: Launch like a double-click (open)
        env:
          SHOT_NAME: screenshot-open-${{ matrix.arch }}
        run: bash .github/scripts/smoke-open.sh "$APP"

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ matrix.arch }}
          path: ${{ runner.temp }}/screenshot-*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/modelio-stdout.log
            ${{ runner.temp }}/sample.txt
            ~/.modelio/**/*.log
          if-no-files-found: ignore

  # Signs a build with a THROW-AWAY self-signed certificate using the same code path as the real Developer ID signing
  # (hardened runtime, entitlements, natives inside jars, bundle, .dmg) and runs the result. It proves the signed app
  # works under the hardened runtime. It cannot test Apple's notary service (needs the real certificate).
  signing-selftest:
    name: Signing self-test (throw-away certificate)
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: modelio-macosx-aarch64

      - name: Create a throw-away self-signed identity
        run: bash .github/scripts/ci-selfsigned-identity.sh

      - name: Build the signed .dmg (hardened runtime + entitlements, no notarization)
        run: bash .github/scripts/package-dmg.sh aarch64 modelio-*-macosx-aarch64.tar.gz "$PWD/signed-test.dmg"

      - name: Check the signatures
        run: |
          echo "---- the disk image itself"
          codesign --verify --verbose=2 signed-test.dmg
          codesign -dv --verbose=2 signed-test.dmg 2>&1 | grep -E "Identifier|Authority|Signature|Format"
          MNT="$RUNNER_TEMP/mnt-signed"; mkdir -p "$MNT"
          hdiutil attach signed-test.dmg -nobrowse -readonly -mountpoint "$MNT" -quiet
          APP="$RUNNER_TEMP/Modelio 5.4.1.app"
          ditto "$MNT/Modelio 5.4.1.app" "$APP"
          hdiutil detach "$MNT" -quiet
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "---- bundle"
          codesign --verify --deep --strict --verbose=2 "$APP"
          INFO="$(codesign -dv --verbose=4 "$APP" 2>&1)"; echo "$INFO" | grep -E "Identifier|Authority|flags|Timestamp|Signature"
          echo "$INFO" | grep -q "flags=.*runtime" || { echo "::error::hardened runtime flag missing on the bundle"; exit 1; }
          ENT="$(codesign -d --entitlements - "$APP" 2>&1)"; echo "$ENT" | grep -E "allow-jit|unsigned-executable|library-validation"
          for k in allow-jit allow-unsigned-executable-memory disable-library-validation; do echo "$ENT" | grep -q "$k" || { echo "::error::entitlement $k missing"; exit 1; }; done
          echo "---- the bundled java executable"
          codesign -dv --verbose=2 "$APP/Contents/Eclipse/jre/Contents/Home/bin/java" 2>&1 | grep -E "flags|Authority|Signature"
          echo "---- native libraries inside jars must carry a signature"
          T="$RUNNER_TEMP/jarnatives"; mkdir -p "$T"
          for j in "$APP"/Contents/Eclipse/plugins/org.eclipse.swt.cocoa.macosx.aarch64_*.jar "$APP"/Contents/Eclipse/plugins/com.sun.jna_5.8.0*.jar; do
            for e in $(unzip -Z1 "$j" | grep -E '\.jnilib$'); do
              unzip -o -j -q "$j" "$e" -d "$T"
              f="$T/$(basename "$e")"
              codesign --verify --verbose=1 "$f" && echo "signed: $(basename "$j")!$e"
              rm -f "$f"
            done
          done
          echo "---- the jar of the nested natives (jython inside the script engine bundle)"
          S="$(ls "$APP"/Contents/Eclipse/plugins/org.modelio.platform.script.engine_*.jar | head -1)"
          unzip -o -q "$S" 'lib/jython2.7/jython.jar' -d "$T"
          for e in $(unzip -Z1 "$T/lib/jython2.7/jython.jar" | grep -E '\.jnilib$'); do
            unzip -o -j -q "$T/lib/jython2.7/jython.jar" "$e" -d "$T"
            codesign --verify --verbose=1 "$T/$(basename "$e")" && echo "signed: jython.jar!$e"
          done

      - name: Install with run-on-mac.sh and start the signed app like a double-click
        env:
          SHOT_NAME: screenshot-signed-aarch64
        run: |
          export INSTALL_DIR="$RUNNER_TEMP/Apps"
          bash .github/scripts/run-on-mac.sh --no-launch "$PWD/signed-test.dmg"
          bash .github/scripts/smoke-open.sh "$INSTALL_DIR/Modelio 5.4.1.app"

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-signed-aarch64
          path: ${{ runner.temp }}/screenshot-*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove the temporary keychain
        if: always()
        run: bash .github/scripts/ci-cleanup-signing.sh
