server:
  port: 8080

spring:
  application:
    name: modelio-web-api

# CORS - allow React dev server
  web:
    cors:
      allowed-origins: "http://localhost:5173"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# Modelio configuration
modelio:
  # Modelio version (determines .modelio subfolder name)
  version:
    major: 5
    minor: 4

  # .modelio user environment folder
  # Default: ~/.modelio/{major}.{minor}/
  # Override with an absolute path to use a custom location
  env:
    path: "${user.home}/.modelio-web/${modelio.version.major}.${modelio.version.minor}"

  # General module catalog — folder containing .jmdac files available for all workspaces
  # Modules installed here can be added to any project
  modules:
    catalog: "${user.home}/modelio-web/modules"

  # Workspace root folder
  # Each workspace is: {root}/{name}/{subdir}/project.conf
  workspace:
    root: "${user.home}/modelio-workspace"
